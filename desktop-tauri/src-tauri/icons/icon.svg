<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 纯黑背景 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#000000"/>

  <!-- 外圈光环 O → 白色 -->
  <circle cx="256" cy="236" r="170" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.25"/>

  <!-- A 字母 - 两条斜线 -->
  <!-- 左斜 -->
  <line x1="162" y1="368" x2="256" y2="100" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
  <!-- 右斜 -->
  <line x1="350" y1="368" x2="256" y2="100" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
  <!-- 横杠 -->
  <line x1="184" y1="258" x2="328" y2="258" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
</svg>
