# 测试生成工作流
name: 测试生成
description: 分析代码 → 生成单元测试 → 审批 → 执行测试 → 审查覆盖率

steps:
  - name: 代码分析
    type: analyze
    timeout: 120
    config:
      provider: deepseek
    prompt_template: |
      ## 代码分析

      {code}

      请分析这段代码，识别需要测试的关键函数和边界情况。

  - name: 测试方案审批
    type: approval
    timeout: 3600

  - name: 生成测试
    type: execute
    timeout: 300
    config:
      provider: deepseek
    prompt_template: |
      ## 测试生成任务

      {plan}

      请为上述代码生成完整的单元测试，包括：
      1. 正常路径测试
      2. 边界条件测试
      3. 错误处理测试

  - name: 测试审查
    type: review
    timeout: 120
    config:
      provider: deepseek
