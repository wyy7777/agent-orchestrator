name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" pyinstaller
        working-directory: backend
      - name: Run tests
        run: pytest -v
        working-directory: backend
      - name: Build backend executable
        run: pyinstaller --onefile --name agent-orch-backend cli.py
        working-directory: backend
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: backend/dist/agent-orch-backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: frontend/out

  create-release:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Package release
        run: |
          mkdir -p release/agent-orchestrator/static
          cp backend-linux/agent-orch-backend release/agent-orchestrator/
          cp -r frontend-static/* release/agent-orchestrator/static/
          cp backend/cli.py release/agent-orchestrator/
          cp backend/pyproject.toml release/agent-orchestrator/
          cp -r backend/app release/agent-orchestrator/app
          cd release
          zip -r agent-orchestrator-${{ github.ref_name }}.zip agent-orchestrator
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/agent-orchestrator-${{ github.ref_name }}.zip
          generate_release_notes: true
